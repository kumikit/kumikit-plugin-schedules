[workspace]
resolver = "3"
members = ["schedules", "e2e"]
default-members = ["schedules"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/kumikit/kumikit-plugin-schedules"
publish = false

[workspace.dependencies]
# Pinned to a commit of kumikit/kumikit; scripts/pin.sh moves every pin together.
kumikit-plugin = { git = "https://github.com/kumikit/kumikit", rev = "c09e83d596c1eebbed7e574187f7fcd608e51efa" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
