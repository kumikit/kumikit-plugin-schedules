name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: kumikit/kumikit/.github/actions/setup-kumikit@v0.1.0-m7.2
        with:
          tools: kumikit,test-kit
      - name: Format, clippy (native and wasm32-wasip2) and unit tests
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --target wasm32-wasip2 -p kumikit-schedules -- -D warnings
          cargo test -p kumikit-schedules
      - name: Build kumikit.schedules WASM
        run: cargo build --target wasm32-wasip2 --release -p kumikit-schedules
      - name: End-to-end tests
        run: cargo test -p kumikit-schedules-e2e
